name: Python package

on:
  push:
    branches:
      - aplha4

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            python-version: 3.8
            arch: x86_64
            target: x86_64-apple-darwin
          - os: macos-14  # Apple Silicon runner
            python-version: 3.8
            arch: arm64
            target: aarch64-apple-darwin
          - os: windows-latest
            python-version: 3.8
            arch: x86_64
            target: x86_64-pc-windows-msvc

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: ${{ matrix.target }}
        override: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build Rust component
      run: |
        maturin build --release --target ${{ matrix.target }}

    - name: Package application (MacOS)
      if: runner.os == 'macOS'
      run: |
        pip install target/wheels/*.whl
        cd application
        pyinstaller main.py --noconsole --onefile --name=paragon
        rm -rf dist/paragon.app
        cp paragon.ico dist/paragon.ico
        cp -R Assets dist/Assets
        cp -R Modules dist/Modules

    - name: Package application (Windows)
      if: runner.os == 'Windows'
      run: |
        .\cicd\package.bat

    - uses: actions/upload-artifact@v2
      with:
        name: Paragon-${{ runner.os }}-${{ matrix.arch }}
        path: application/dist
